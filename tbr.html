<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TBR — Book Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .tbr-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 0.5px solid rgba(58,58,40,0.15);
    }
    .tbr-nav a {
      font-family: var(--f-body);
      font-size: 0.8rem;
      color: var(--ink-2);
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }
    .tbr-nav a:hover { color: #BB858B; }
    .tbr-nav-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .tbr-header {
      padding: 2.5rem 1.25rem 1.75rem;
      border-bottom: 0.5px solid rgba(58,58,40,0.15);
    }

    /* Suggest form */
    .suggest-section {
      padding: 1.25rem;
      border-bottom: 0.5px solid rgba(58,58,40,0.15);
    }
    .suggest-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: var(--f-display);
      font-size: 0.95rem;
      color: var(--ink-2);
      transition: color 0.15s;
    }
    .suggest-toggle:hover { color: var(--ink); }
    .suggest-toggle-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #6b4a27;
      color: #EFEBCE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .suggest-toggle.open .suggest-toggle-icon { transform: rotate(45deg); }

    .suggest-form {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .suggest-form.open { display: flex; }

    .suggest-field label {
      display: block;
      font-family: var(--f-body);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.35rem;
    }

    .suggest-submit {
      background: #6b4a27;
      color: #EFEBCE;
      border: none;
      border-radius: var(--r-lg);
      padding: 0.625rem 1.25rem;
      font-family: var(--f-body);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.15s;
    }
    .suggest-submit:hover { background: #7d5830; }
    .suggest-submit:disabled { opacity: 0.6; cursor: default; }

    /* TBR list */
    .tbr-list {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .tbr-empty {
      padding: 3rem 1.25rem;
      text-align: center;
      font-family: var(--f-body);
      font-size: 0.9rem;
      color: var(--ink-3);
      font-style: italic;
    }

    .tbr-item {
      display: flex;
      align-items: flex-start;
      gap: 0.875rem;
      padding: 1rem 0;
      border-bottom: 0.5px solid var(--line);
    }
    .tbr-item:last-child { border-bottom: none; }

    .tbr-cover {
      width: 44px;
      min-width: 44px;
      height: 64px;
      border-radius: var(--r-sm);
      object-fit: cover;
      border: 0.5px solid var(--line);
    }
    .tbr-cover-ph {
      width: 44px;
      min-width: 44px;
      height: 64px;
      border-radius: var(--r-sm);
      background: linear-gradient(155deg, #D8A48F, #c4907a);
      border: 0.5px solid var(--line);
    }

    .tbr-info { flex: 1; min-width: 0; }
    .tbr-title {
      font-family: var(--f-display);
      font-size: 0.95rem;
      color: var(--ink);
      display: block;
      margin-bottom: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tbr-author {
      font-family: var(--f-body);
      font-size: 0.8rem;
      color: var(--ink-3);
      font-style: italic;
      display: block;
      margin-bottom: 0.625rem;
    }
    .tbr-actions { display: flex; align-items: center; gap: 0.5rem; }
    .tbr-promote-btn {
      font-family: var(--f-body);
      font-size: 0.72rem;
      color: var(--ink-3);
      background: none;
      border: 0.5px solid var(--line);
      border-radius: 100px;
      padding: 0.25rem 0.625rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: color 0.15s, border-color 0.15s;
    }
    .tbr-promote-btn:hover { color: #6b4a27; border-color: #6b4a27; }

    /* Vote button */
    .vote-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: 0.5px solid var(--line);
      border-radius: var(--r-md);
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      min-width: 42px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .vote-btn:hover { background: var(--bg-card-h); border-color: #6b4a27; transform: translateY(-1px); }
    .vote-btn.voted { background: #6b4a27; border-color: #6b4a27; color: #EFEBCE; }
    .vote-btn.voted .vote-arrow { color: #EFEBCE; }
    .vote-btn.voted .vote-count { color: #EFEBCE; }
    .vote-arrow {
      font-size: 0.9rem;
      color: var(--ink-2);
      line-height: 1;
    }
    .vote-count {
      font-family: var(--f-display);
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1;
    }

    /* Promote inline panel */
    .promote-panel {
      display: none;
      margin-top: 0.75rem;
      padding: 0.875rem;
      background: var(--bg-card);
      border: 0.5px solid var(--line);
      border-radius: var(--r-lg);
      gap: 0.625rem;
      flex-direction: column;
    }
    .promote-panel.open { display: flex; }
    .promote-panel label {
      font-family: var(--f-body);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      display: block;
      margin-bottom: 0.3rem;
    }
    .promote-row { display: flex; gap: 0.5rem; align-items: flex-end; }
    .promote-confirm {
      background: #6b4a27;
      color: #EFEBCE;
      border: none;
      border-radius: var(--r-lg);
      padding: 0.5rem 0.875rem;
      font-family: var(--f-body);
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .promote-confirm:hover { background: #7d5830; }
    .promote-confirm:disabled { opacity: 0.6; cursor: default; }
    .promote-cancel {
      background: none;
      border: none;
      font-family: var(--f-body);
      font-size: 0.78rem;
      color: var(--ink-3);
      cursor: pointer;
      padding: 0.5rem 0;
    }
    .promote-error {
      font-family: var(--f-body);
      font-size: 0.78rem;
      color: #BB858B;
      font-style: italic;
    }

    @media (min-width: 640px) {
      .tbr-header { padding: 3rem 2rem 2rem; }
      .tbr-nav { padding: 1rem 2rem; }
      .suggest-section, .tbr-list { padding-left: 2rem; padding-right: 2rem; }
    }
  </style>
</head>
<body>

  <nav class="tbr-nav">
    <a href="books.html">← All books</a>
    <span class="tbr-nav-label">TBR</span>
    <span></span>
  </nav>

  <header class="tbr-header">
    <span class="page-eyebrow">the wishlist</span>
    <h1 class="page-title">To Be <em>Read</em></h1>
    <div class="page-title-rule"><span>vote for your pick</span></div>
  </header>

  <!-- Suggest form -->
  <div class="suggest-section">
    <button class="suggest-toggle" id="suggest-toggle">
      <span class="suggest-toggle-icon">+</span>
      Suggest a book
    </button>
    <form class="suggest-form" id="suggest-form">
      <div class="suggest-field">
        <label for="tbr-title">Book title</label>
        <input type="text" id="tbr-title" placeholder="e.g. Intermezzo" required autocomplete="off" />
      </div>
      <div class="suggest-field">
        <label for="tbr-author">Author</label>
        <input type="text" id="tbr-author" placeholder="e.g. Sally Rooney" required autocomplete="off" />
      </div>
      <button type="submit" class="suggest-submit" id="suggest-btn">Add to TBR</button>
    </form>
  </div>

  <!-- TBR list -->
  <div class="tbr-list" id="tbr-list">
    <p class="tbr-empty">Loading…</p>
  </div>

  <script>
    // Toggle suggest form
    const toggle = document.getElementById('suggest-toggle');
    const form = document.getElementById('suggest-form');
    toggle.addEventListener('click', () => {
      const open = form.classList.toggle('open');
      toggle.classList.toggle('open', open);
    });

    // Load TBR books
    async function loadTBR() {
      const list = document.getElementById('tbr-list');
      try {
        const res = await fetch('/api/books');
        const data = await res.json();
        const books = data.records
          .map(r => ({ id: r.id, ...r.fields }))
          .filter(b => b.TBR)
          .sort((a, b) => (b.TBRVotes || 0) - (a.TBRVotes || 0));

        if (books.length === 0) {
          list.innerHTML = `<p class="tbr-empty">No suggestions yet — be the first to add one!</p>`;
          return;
        }

        list.innerHTML = '';
        books.forEach(book => {
          const item = document.createElement('div');
          item.className = 'tbr-item';
          item.dataset.id = book.id;
          item.innerHTML = `
            <div>
              ${book.BookCover
                ? `<img src="${book.BookCover}" alt="${book.Title}" class="tbr-cover" />`
                : `<div class="tbr-cover-ph"></div>`}
            </div>
            <div class="tbr-info">
              <span class="tbr-title">${book.Title}</span>
              <span class="tbr-author">${book.Author}</span>
              <div class="tbr-actions">
                <button class="tbr-promote-btn" data-id="${book.id}">Set as next read →</button>
              </div>
              <div class="promote-panel" id="promote-${book.id}">
                <div>
                  <label>Reading month</label>
                  <input type="month" class="promote-month" />
                </div>
                <div>
                  <label>Club PIN</label>
                  <div class="promote-row">
                    <input type="password" class="promote-pin" maxlength="6" placeholder="·····" inputmode="numeric" style="max-width:120px" />
                    <button class="promote-confirm" data-id="${book.id}">Confirm</button>
                    <button type="button" class="promote-cancel">Cancel</button>
                  </div>
                </div>
                <span class="promote-error" style="display:none"></span>
              </div>
            </div>
            <button class="vote-btn" data-id="${book.id}" data-votes="${book.TBRVotes || 0}">
              <span class="vote-arrow">▲</span>
              <span class="vote-count">${book.TBRVotes || 0}</span>
            </button>
          `;
          list.appendChild(item);
        });

        attachListeners();
      } catch (err) {
        document.getElementById('tbr-list').innerHTML =
          `<p class="tbr-empty">Couldn't load the list — try refreshing.</p>`;
      }
    }

    function attachListeners() {
      // Vote buttons
      document.querySelectorAll('.vote-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (btn.classList.contains('voted') || btn.disabled) return;
          btn.disabled = true;
          const id = btn.dataset.id;
          try {
            const res = await fetch('/api/tbr-vote', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ recordId: id }),
            });
            const data = await res.json();
            if (res.ok) {
              btn.querySelector('.vote-count').textContent = data.votes;
              btn.classList.add('voted');
            }
          } catch {}
          btn.disabled = false;
        });
      });

      // Promote buttons — show inline panel
      document.querySelectorAll('.tbr-promote-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const panel = document.getElementById(`promote-${id}`);
          panel.classList.toggle('open');
        });
      });

      // Cancel buttons
      document.querySelectorAll('.promote-cancel').forEach(btn => {
        btn.addEventListener('click', e => {
          e.target.closest('.promote-panel').classList.remove('open');
        });
      });

      // Confirm promote buttons
      document.querySelectorAll('.promote-confirm').forEach(btn => {
        btn.addEventListener('click', async () => {
          const panel = btn.closest('.promote-panel');
          const id = btn.dataset.id;
          const pin = panel.querySelector('.promote-pin').value.trim();
          const month = panel.querySelector('.promote-month').value;
          const errEl = panel.querySelector('.promote-error');

          if (!pin) { errEl.textContent = 'Enter the club PIN.'; errEl.style.display = ''; return; }

          btn.textContent = 'Promoting…';
          btn.disabled = true;
          errEl.style.display = 'none';

          try {
            const res = await fetch('/api/tbr-promote', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ recordId: id, pin, month }),
            });
            const data = await res.json();

            if (res.status === 403) {
              errEl.textContent = 'Incorrect PIN — try again.';
              errEl.style.display = '';
              btn.textContent = 'Confirm';
              btn.disabled = false;
            } else if (res.ok) {
              panel.closest('.tbr-item').innerHTML = `
                <div style="padding:0.75rem 0;font-family:var(--f-body);font-size:0.875rem;color:var(--ink-3);font-style:italic;width:100%;">
                  "${data.book?.Title}" is now set as the current read ✓
                </div>`;
            } else {
              errEl.textContent = data.error || 'Something went wrong.';
              errEl.style.display = '';
              btn.textContent = 'Confirm';
              btn.disabled = false;
            }
          } catch {
            errEl.textContent = 'Connection error — try again.';
            errEl.style.display = '';
            btn.textContent = 'Confirm';
            btn.disabled = false;
          }
        });
      });
    }

    // Add book form
    document.getElementById('suggest-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('suggest-btn');
      btn.textContent = 'Adding…';
      btn.disabled = true;

      const title = document.getElementById('tbr-title').value.trim();
      const author = document.getElementById('tbr-author').value.trim();

      try {
        const res = await fetch('/api/tbr-add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, author }),
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('tbr-title').value = '';
          document.getElementById('tbr-author').value = '';
          btn.textContent = 'Add to TBR';
          btn.disabled = false;
          form.classList.remove('open');
          toggle.classList.remove('open');
          loadTBR();
        } else {
          alert(data.error || 'Something went wrong.');
          btn.textContent = 'Add to TBR';
          btn.disabled = false;
        }
      } catch {
        alert('Connection error — try again.');
        btn.textContent = 'Add to TBR';
        btn.disabled = false;
      }
    });

    loadTBR();
  </script>
</body>
</html>
