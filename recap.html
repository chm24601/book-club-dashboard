<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Year Recap — Book Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-maskable.svg">
  <meta name="theme-color" content="#0e0b08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Book Club">
  <style>
    /* ── Override global bg + hide botanical pattern ── */
    body { background: #0e0b08 !important; }
    body::before { display: none !important; }

    /* ── Sticky frosted nav ── */
    .recap-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem;
      background: rgba(14,11,8,0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 0.5px solid rgba(239,235,206,0.06);
    }
    .recap-nav a {
      font-family: var(--f-body); font-size: 0.82rem;
      color: rgba(239,235,206,0.6); letter-spacing: 0.04em;
    }
    .recap-nav a:hover { color: #EFEBCE; }
    .recap-nav-label {
      font-size: 0.58rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: rgba(239,235,206,0.3);
    }

    /* ── Hero ── */
    .recap-hero {
      min-height: 80vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 4rem 1.5rem 3rem;
      background: linear-gradient(155deg, #2a0d18 0%, #1a0a22 48%, #0e0b08 100%);
      position: relative; overflow: hidden; text-align: center;
    }
    .recap-hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 22% 38%, rgba(107,39,55,0.48) 0%, transparent 52%),
        radial-gradient(ellipse at 78% 65%, rgba(74,58,107,0.38) 0%, transparent 52%);
    }
    .hero-eyebrow {
      font-family: var(--f-body); font-size: 0.6rem;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: rgba(239,235,206,0.38);
      position: relative; z-index: 1; margin-bottom: 1.25rem;
    }
    .hero-year {
      font-family: var(--f-display);
      font-size: clamp(5.5rem, 28vw, 10rem);
      font-style: italic; line-height: 0.88;
      color: #EFEBCE; letter-spacing: -0.02em;
      position: relative; z-index: 1;
    }
    .hero-subtitle {
      font-family: var(--f-display);
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-style: italic; color: rgba(239,235,206,0.38);
      position: relative; z-index: 1; margin-top: 1.25rem;
    }
    .year-switcher {
      display: flex; align-items: center; gap: 1.5rem;
      margin-top: 2.75rem; position: relative; z-index: 1;
    }
    .year-btn {
      background: rgba(239,235,206,0.08);
      border: 0.5px solid rgba(239,235,206,0.18);
      border-radius: 100px; width: 44px; height: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: rgba(239,235,206,0.65);
      cursor: pointer; transition: all 0.15s;
    }
    .year-btn:hover { background: rgba(239,235,206,0.16); color: #EFEBCE; border-color: rgba(239,235,206,0.35); }
    .year-btn:active { transform: scale(0.9) !important; transition: transform 0.07s !important; }
    .year-btn:disabled { opacity: 0.15; cursor: default; }
    .year-display { display: none; } /* year lives in hero-year */

    /* ── Panel base ── */
    #recap-content { display: flex; flex-direction: column; }

    .wrapped-panel {
      min-height: 82vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 4rem 2rem; position: relative;
      overflow: hidden; text-align: center;
    }
    .panel-glow { position: absolute; inset: 0; pointer-events: none; }
    .panel-eyebrow {
      font-family: var(--f-body); font-size: 0.62rem;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: rgba(239,235,206,0.42); margin-bottom: 0.875rem;
      position: relative; z-index: 1;
    }
    .panel-num {
      font-family: var(--f-display);
      font-size: clamp(8rem, 36vw, 13rem);
      font-style: italic; line-height: 0.82;
      letter-spacing: -0.03em;
      position: relative; z-index: 1;
    }
    .panel-label {
      font-family: var(--f-display);
      font-size: clamp(1.3rem, 4vw, 2rem);
      color: rgba(239,235,206,0.55); margin-top: 1rem;
      font-style: italic; position: relative; z-index: 1;
    }

    /* Panel colour themes */
    .panel-burgundy { background: linear-gradient(155deg, #2d0f1a 0%, #180810 100%); }
    .panel-burgundy .panel-num { color: #BB858B; }

    .panel-olive { background: linear-gradient(155deg, #0d1a08 0%, #07100a 100%); }
    .panel-olive .panel-num { color: #a8c46b; }

    /* ── Featured book panels ── */
    .panel-book {
      min-height: 88vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 0 1.75rem 4.5rem;
      position: relative; overflow: hidden; text-align: center;
      background: #0e0b08;
    }
    .panel-book-blur {
      position: absolute; inset: -40px;
      background-size: cover; background-position: center;
      filter: blur(34px) saturate(1.9) brightness(0.3);
      transform: scale(1.12); z-index: 0;
    }
    .panel-book-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.08) 0%,
        rgba(0,0,0,0.52) 50%,
        rgba(0,0,0,0.88) 100%);
    }
    .panel-book-cover {
      width: 120px; border-radius: 10px;
      box-shadow: 0 28px 70px rgba(0,0,0,0.75), 0 4px 14px rgba(0,0,0,0.5);
      position: relative; z-index: 2;
      margin-bottom: 1.75rem; object-fit: cover;
    }
    .panel-book-cover-ph {
      width: 120px; height: 180px; border-radius: 10px;
      background: linear-gradient(155deg, #D8A48F, #c4907a);
      box-shadow: 0 28px 70px rgba(0,0,0,0.75);
      position: relative; z-index: 2; margin-bottom: 1.75rem;
    }
    .panel-book-eyebrow {
      font-family: var(--f-body); font-size: 0.62rem;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: rgba(239,235,206,0.5);
      position: relative; z-index: 2; margin-bottom: 1rem;
    }
    .panel-book-stars { position: relative; z-index: 2; margin-bottom: 0.625rem; }
    .panel-book-title {
      font-family: var(--f-display);
      font-size: clamp(1.6rem, 5.5vw, 2.4rem);
      color: #EFEBCE; line-height: 1.1;
      position: relative; z-index: 2; margin-bottom: 0.4rem;
    }
    .panel-book-author {
      font-family: var(--f-body); font-style: italic; font-size: 1rem;
      color: rgba(239,235,206,0.58);
      position: relative; z-index: 2; margin-bottom: 0.75rem;
    }
    .panel-book-detail {
      font-family: var(--f-body); font-size: 0.82rem;
      color: rgba(239,235,206,0.4);
      position: relative; z-index: 2; letter-spacing: 0.04em;
    }

    /* ── Month chart ── */
    .panel-months {
      background: linear-gradient(155deg, #090d18 0%, #06080f 100%);
      padding: 4.5rem 2rem 5rem; text-align: left;
    }
    .month-chart-title {
      font-family: var(--f-display);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-style: italic; color: #EFEBCE; margin-bottom: 2.5rem;
    }
    .month-bars { display: flex; flex-direction: column; gap: 1.125rem; }
    .month-row { display: flex; align-items: center; gap: 1rem; }
    .month-name {
      font-family: var(--f-body); font-size: 0.78rem;
      color: rgba(239,235,206,0.38);
      width: 2.5rem; flex-shrink: 0; letter-spacing: 0.04em;
    }
    .month-bar-wrap {
      flex: 1; background: rgba(239,235,206,0.06);
      border-radius: 100px; height: 12px; overflow: hidden;
    }
    .month-bar {
      height: 12px; border-radius: 100px;
      background: linear-gradient(to right, #6b2737, #BB858B);
      width: 0; transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .month-count {
      font-family: var(--f-display); font-size: 1rem;
      color: rgba(239,235,206,0.58);
      min-width: 1.5rem; text-align: right; font-style: italic;
    }

    /* ── Member panel ── */
    .panel-members {
      background: #0e0b08;
      padding: 4.5rem 1.25rem 5.5rem; text-align: center;
    }
    .members-title {
      font-family: var(--f-display);
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      font-style: italic; color: #EFEBCE; margin-bottom: 0.4rem;
    }
    .members-subtitle {
      font-family: var(--f-body); font-size: 0.85rem;
      color: rgba(239,235,206,0.32); font-style: italic; margin-bottom: 2.75rem;
    }
    .member-cards {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem; max-width: 460px; margin: 0 auto;
    }
    .member-card {
      border-radius: 20px; padding: 1.75rem 1rem 1.5rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.45rem;
    }
    .member-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--f-display); font-size: 1.5rem;
      color: rgba(239,235,206,0.92); font-style: italic;
      margin-bottom: 0.25rem;
    }
    .member-name {
      font-family: var(--f-display); font-size: 0.9rem;
      color: rgba(239,235,206,0.65);
    }
    .member-big-num {
      font-family: var(--f-display); font-size: 3.2rem;
      font-style: italic; line-height: 1; color: #EFEBCE;
    }
    .member-reviews-label {
      font-family: var(--f-body); font-size: 0.62rem;
      color: rgba(239,235,206,0.35);
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .member-avg {
      font-family: var(--f-body); font-size: 0.78rem;
      color: rgba(239,235,206,0.4); font-style: italic;
    }

    /* ── Empty / loading ── */
    .recap-empty {
      min-height: 50vh; display: flex;
      align-items: center; justify-content: center;
      font-family: var(--f-body); font-size: 1rem;
      color: rgba(239,235,206,0.3); font-style: italic;
    }

    /* ── Footer ── */
    .recap-footer {
      background: #0e0b08; padding: 2rem 1.25rem 4rem;
      text-align: center;
      border-top: 0.5px solid rgba(239,235,206,0.05);
    }
    .recap-footer a {
      font-family: var(--f-body); font-size: 0.8rem;
      color: rgba(239,235,206,0.28); letter-spacing: 0.06em;
      transition: color 0.15s;
    }
    .recap-footer a:hover { color: rgba(239,235,206,0.7); }

    /* ── Scroll-in animation ── */
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: none; }
    }
    .wrapped-panel, .panel-book, .panel-months, .panel-members { opacity: 0; }
    .panel-visible { animation: panelIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @media (min-width: 640px) {
      .member-cards { grid-template-columns: repeat(4, 1fr); max-width: 680px; }
      .wrapped-panel { min-height: 70vh; }
      .panel-book { min-height: 75vh; }
      .panel-months, .panel-members { padding-left: 3rem; padding-right: 3rem; }
    }
  </style>
</head>
<body>

  <nav class="recap-nav">
    <a href="books.html">← All books</a>
    <span class="recap-nav-label">Year Recap</span>
    <span></span>
  </nav>

  <header class="recap-hero">
    <p class="hero-eyebrow">the book club for difficult women</p>
    <div class="hero-year" id="year-display">—</div>
    <p class="hero-subtitle">your year in books</p>
    <div class="year-switcher">
      <button class="year-btn" id="prev-year">←</button>
      <button class="year-btn" id="next-year">→</button>
    </div>
  </header>

  <div id="recap-content">
    <div class="recap-empty">Loading…</div>
  </div>

  <footer class="recap-footer">
    <a href="books.html">← back to the shelf</a>
  </footer>

  <script>
    const MEMBER_COLORS = { Courtney: '#6b2737', Emily: '#5c6b27', Alyssa: '#27556b', Sam: '#6b4a27' };
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function normalize(s) { return s?.toLowerCase().trim() || ''; }

    function starsHTML(r) {
      if (!r) return '';
      const full = Math.floor(r);
      const half = r % 1 >= 0.5;
      const empty = 5 - full - (half ? 1 : 0);
      return `<span class="stars" style="color:#EFEBCE;font-size:1.2rem;letter-spacing:1px">
        ${'★'.repeat(full)}${half ? `<span style="font-size:0.7em;vertical-align:middle">½</span>` : ''}
        <span style="opacity:0.2">${'★'.repeat(empty)}</span>
      </span>`;
    }

    let allBooks = [], allEntries = [], currentYear = new Date().getFullYear() - 1;
    let availableYears = [];
    let scrollObserver = null;

    async function loadData() {
      const [booksRes, entriesRes] = await Promise.all([fetch('/api/books'), fetch('/api/entries')]);
      const booksData = await booksRes.json();
      const entriesData = await entriesRes.json();
      allBooks = booksData.records.map(r => r.fields).filter(b => !b.TBR && b['Date Read']);
      allEntries = entriesData.records.map(r => r.fields);
      availableYears = [...new Set(allBooks.map(b => new Date(b['Date Read']).getFullYear()))].sort((a,b) => a - b);
      if (!availableYears.includes(currentYear)) currentYear = availableYears[availableYears.length - 1] || new Date().getFullYear();
      renderYear();
    }

    function renderYear() {
      document.getElementById('year-display').textContent = currentYear;
      document.getElementById('prev-year').disabled = currentYear <= availableYears[0];
      document.getElementById('next-year').disabled = currentYear >= availableYears[availableYears.length - 1];

      if (scrollObserver) scrollObserver.disconnect();

      const books = allBooks.filter(b => new Date(b['Date Read']).getFullYear() === currentYear);
      if (books.length === 0) {
        document.getElementById('recap-content').innerHTML =
          `<div class="recap-empty">No books logged for ${currentYear} yet.</div>`;
        return;
      }

      // ── Compute stats ──
      const booksWithStats = books.map(book => {
        const slug = normalize(book.Slug || book.Title);
        const entries = allEntries.filter(e => e.BookSlug && normalize(e.BookSlug) === slug);
        const ratings = entries.map(e => Number(e.Rating)).filter(r => !isNaN(r) && r > 0);
        const avg = ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : null;
        const variance = ratings.length >= 2
          ? ratings.reduce((sum,r) => sum + Math.pow(r - avg, 2), 0) / ratings.length : 0;
        return { ...book, entries, ratings, avg, variance };
      });

      const totalReviews   = booksWithStats.reduce((s,b) => s + b.entries.length, 0);
      const highestRated   = [...booksWithStats].filter(b => b.avg !== null).sort((a,b) => b.avg - a.avg)[0];
      const mostReviewed   = [...booksWithStats].sort((a,b) => b.entries.length - a.entries.length)[0];
      const mostDivisive   = [...booksWithStats].filter(b => b.ratings.length >= 2).sort((a,b) => b.variance - a.variance)[0];

      // Member map
      const memberMap = {};
      booksWithStats.forEach(book => {
        book.entries.forEach(e => {
          if (!e.MemberName) return;
          if (!memberMap[e.MemberName]) memberMap[e.MemberName] = { reviews: 0, ratings: [] };
          memberMap[e.MemberName].reviews++;
          const r = Number(e.Rating);
          if (!isNaN(r) && r > 0) memberMap[e.MemberName].ratings.push(r);
        });
      });

      // Month counts
      const monthCounts = Array(12).fill(0);
      books.forEach(b => { monthCounts[new Date(b['Date Read']).getMonth()]++; });
      const maxMonthCount = Math.max(...monthCounts, 1);

      // ── Panel builders ──
      const statPanel = (cls, glow, eyebrow, count, label) => `
        <div class="wrapped-panel ${cls}">
          <div class="panel-glow" style="background:${glow}"></div>
          <p class="panel-eyebrow">${eyebrow}</p>
          <div class="panel-num" data-count="${count}">0</div>
          <p class="panel-label">${label}</p>
        </div>`;

      const bookPanel = (book, eyebrow, detail) => `
        <div class="panel-book">
          <div class="panel-book-blur" style="background-image:url('${book.BookCover || ''}');background-color:#1a0a12"></div>
          <div class="panel-book-overlay"></div>
          <p class="panel-book-eyebrow">${eyebrow}</p>
          ${book.BookCover
            ? `<img src="${book.BookCover}" class="panel-book-cover" alt="${book.Title}" />`
            : '<div class="panel-book-cover-ph"></div>'}
          ${book.avg ? `<div class="panel-book-stars">${starsHTML(book.avg)}</div>` : ''}
          <h2 class="panel-book-title">${book.Title}</h2>
          <p class="panel-book-author">${book.Author}</p>
          <p class="panel-book-detail">${detail}</p>
        </div>`;

      const panels = [
        statPanel(
          'panel-burgundy',
          'radial-gradient(ellipse at 50% 50%, rgba(107,39,55,0.48), transparent 65%)',
          'this year, you read',
          books.length,
          `book${books.length !== 1 ? 's' : ''}`
        ),

        totalReviews > 0 ? statPanel(
          'panel-olive',
          'radial-gradient(ellipse at 50% 50%, rgba(92,107,39,0.38), transparent 65%)',
          'and wrote',
          totalReviews,
          `review${totalReviews !== 1 ? 's' : ''}`
        ) : '',

        highestRated ? bookPanel(
          highestRated, '⭐ highest rated',
          `${highestRated.avg.toFixed(1)} avg from the club`
        ) : '',

        mostReviewed && mostReviewed.entries.length > 1 ? bookPanel(
          mostReviewed, '💬 most talked about',
          `${mostReviewed.entries.length} reviews written`
        ) : '',

        mostDivisive ? bookPanel(
          mostDivisive, '⚡ most divisive',
          `ratings ranged from ${Math.min(...mostDivisive.ratings)} to ${Math.max(...mostDivisive.ratings)} ★`
        ) : '',

        `<div class="panel-months">
          <h2 class="month-chart-title">when you read</h2>
          <div class="month-bars">
            ${monthCounts.map((count, i) => count > 0 ? `
              <div class="month-row">
                <span class="month-name">${MONTHS[i]}</span>
                <div class="month-bar-wrap">
                  <div class="month-bar" data-width="${Math.round(count/maxMonthCount*100)}"></div>
                </div>
                <span class="month-count">${count}</span>
              </div>` : '').join('')}
          </div>
        </div>`,

        `<div class="panel-members">
          <h2 class="members-title">your crew</h2>
          <p class="members-subtitle">who showed up this year</p>
          <div class="member-cards">
            ${Object.entries(memberMap).map(([name, data]) => {
              const avgGiven = data.ratings.length
                ? (data.ratings.reduce((a,b)=>a+b,0)/data.ratings.length).toFixed(1) : null;
              const color = MEMBER_COLORS[name] || '#8a8a6a';
              return `
                <div class="member-card" style="background:${color}1e;border:0.5px solid ${color}38;">
                  <div class="member-avatar" style="background:${color}">${name[0]}</div>
                  <div class="member-name">${name}</div>
                  <div class="member-big-num">${data.reviews}</div>
                  <div class="member-reviews-label">review${data.reviews !== 1 ? 's' : ''}</div>
                  ${avgGiven ? `<div class="member-avg">avg ${avgGiven} ★</div>` : ''}
                </div>`;
            }).join('')}
          </div>
        </div>`
      ].filter(Boolean);

      document.getElementById('recap-content').innerHTML = panels.join('');

      // ── Scroll-triggered reveal + count-up + bar animations ──
      scrollObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          el.classList.add('panel-visible');
          scrollObserver.unobserve(el);

          // Count-up animation
          const numEl = el.querySelector('[data-count]');
          if (numEl) {
            const target = parseInt(numEl.dataset.count);
            const dur = 900;
            const t0 = performance.now();
            const tick = now => {
              const p = Math.min((now - t0) / dur, 1);
              const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
              numEl.textContent = Math.round(eased * target);
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          }

          // Month bar width (double rAF ensures transition fires)
          el.querySelectorAll('.month-bar[data-width]').forEach(bar => {
            const w = bar.dataset.width;
            requestAnimationFrame(() => requestAnimationFrame(() => {
              bar.style.width = w + '%';
            }));
          });
        });
      }, { threshold: 0.18 });

      document.querySelectorAll('.wrapped-panel, .panel-book, .panel-months, .panel-members')
        .forEach(el => scrollObserver.observe(el));
    }

    document.getElementById('prev-year').addEventListener('click', () => { currentYear--; renderYear(); });
    document.getElementById('next-year').addEventListener('click', () => { currentYear++; renderYear(); });

    loadData();
  </script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
