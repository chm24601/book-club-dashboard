<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <span class="page-eyebrow">our book club</span>
    <h1 class="page-title">The Book Club for<br><em>Difficult Women</em></h1>
    <div class="page-title-rule"><span>est. 2024</span></div>
    <div class="pill-group">
      <a href="stats.html" class="stats-pill">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="7" width="2.5" height="6" rx="1" fill="currentColor"/>
          <rect x="5.5" y="4" width="2.5" height="9" rx="1" fill="currentColor"/>
          <rect x="10" y="1" width="2.5" height="12" rx="1" fill="currentColor"/>
        </svg>
        Club Stats
        <span class="stats-pill-arrow">→</span>
      </a>
      <a href="add-book.html" class="stats-pill pill-olive">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="1.5" y="3.5" width="11" height="9" rx="1" stroke="currentColor" stroke-width="1.1" fill="none"/>
          <line x1="1.5" y1="6" x2="12.5" y2="6" stroke="currentColor" stroke-width="1.1"/>
          <line x1="4.5" y1="1.5" x2="4.5" y2="5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="9.5" y1="1.5" x2="9.5" y2="5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          <line x1="7" y1="8" x2="7" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="5.25" y1="9.5" x2="8.75" y2="9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Add Next Book
        <span class="stats-pill-arrow">→</span>
      </a>
      <a href="chat.html" class="stats-pill pill-ai">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1.5L8.2 5.5L12.5 7L8.2 8.5L7 12.5L5.8 8.5L1.5 7L5.8 5.5L7 1.5Z" fill="currentColor"/>
        </svg>
        Book Advisor
        <span class="stats-pill-arrow">→</span>
      </a>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Search by title or author…" autocomplete="off" />
    <select id="yearFilter">
      <option value="all">All years</option>
    </select>
  </div>

  <div id="books-container"></div>

  <script src="script.js"></script>
</body>
</html>
