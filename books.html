<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <span class="page-eyebrow">our book club</span>
    <h1 class="page-title">The Book Club for<br><em>Difficult Women</em></h1>
    <div class="page-title-rule"><span>est. 2024</span></div>
    <a href="stats.html" class="stats-pill">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="7" width="2.5" height="6" rx="1" fill="currentColor"/>
        <rect x="5.5" y="4" width="2.5" height="9" rx="1" fill="currentColor"/>
        <rect x="10" y="1" width="2.5" height="12" rx="1" fill="currentColor"/>
      </svg>
      Club Stats
      <span class="stats-pill-arrow">→</span>
    </a>
  </header>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Search by title or author…" autocomplete="off" />
    <select id="yearFilter">
      <option value="all">All years</option>
    </select>
  </div>

  <div id="books-container"></div>

  <script src="script.js"></script>
</body>
</html>
