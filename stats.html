<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stats — Book Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .stats-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 0.5px solid rgba(58,58,40,0.15);
    }
    .stats-nav a {
      font-family: var(--f-body);
      font-size: 0.8rem;
      color: var(--ink-2);
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }
    .stats-nav a:hover { color: #BB858B; }
    .stats-nav .nav-center {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .stats-header {
      padding: 2.5rem 1.25rem 1.75rem;
      border-bottom: 0.5px solid rgba(58,58,40,0.15);
    }
    .stats-header .page-eyebrow { margin-bottom: 0.6rem; }
    .stats-header .page-title { margin-bottom: 1rem; }

    .stats-wrap {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    /* ── Metric cards row ── */
    .metric-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 0.5px solid var(--line);
      border-radius: var(--r-lg);
      padding: 1rem 1.125rem;
      box-shadow: 0 2px 8px rgba(58,58,40,0.07);
    }
    .metric-label {
      font-family: var(--f-body);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      display: block;
      margin-bottom: 0.4rem;
    }
    .metric-value {
      font-family: var(--f-display);
      font-size: 2rem;
      color: var(--ink);
      line-height: 1;
      display: block;
    }
    .metric-sub {
      font-family: var(--f-body);
      font-size: 0.75rem;
      color: var(--ink-3);
      font-style: italic;
      margin-top: 0.2rem;
      display: block;
    }

    /* ── Section panels ── */
    .stat-panel {
      background: var(--bg-card);
      border: 0.5px solid var(--line);
      border-radius: var(--r-xl);
      padding: 1.25rem;
      box-shadow: 0 2px 10px rgba(58,58,40,0.07);
    }

    .stat-panel-title {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 1rem;
      padding-bottom: 0.625rem;
      border-bottom: 0.5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Member rows ── */
    .member-row {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.625rem 0;
      border-bottom: 0.5px solid var(--line);
    }
    .member-row:last-child { border-bottom: none; }

    .member-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: a06070;
      color: #EFEBCE;
      font-family: var(--f-display);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .member-avatar.av-2 { background: #6b2737; }
    .member-avatar.av-3 { background: #8a8a6a; }
    .member-avatar.av-4 { background: #D8A48F; color: var(--ink); }

    .member-info { flex: 1; min-width: 0; }
    .member-name {
      font-family: var(--f-display);
      font-size: 0.95rem;
      color: var(--ink);
      display: block;
      margin-bottom: 0.1rem;
    }
    .member-sub {
      font-size: 0.75rem;
      color: var(--ink-3);
      font-style: italic;
    }
    .member-rating {
      font-family: var(--f-display);
      font-size: 1.1rem;
      color: #BB858B;
      flex-shrink: 0;
    }

    /* ── Bar chart ── */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0;
      border-bottom: 0.5px solid var(--line);
    }
    .bar-row:last-child { border-bottom: none; }
    .bar-label {
      font-family: var(--f-display);
      font-size: 0.85rem;
      color: var(--ink);
      width: 80px;
      min-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(58,58,40,0.10);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #BB858B;
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .bar-val {
      font-family: var(--f-display);
      font-size: 0.85rem;
      color: var(--ink-2);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Book highlight cards ── */
    .book-highlight {
      display: flex;
      gap: 0.875rem;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 0.5px solid var(--line);
    }
    .book-highlight:last-child { border-bottom: none; }
    .book-highlight img,
    .book-highlight .bh-ph {
      width: 40px;
      min-width: 40px;
      height: 58px;
      border-radius: var(--r-sm);
      object-fit: cover;
      border: 0.5px solid var(--line);
    }
    .book-highlight .bh-ph {
      background: linear-gradient(155deg, #D8A48F, #c4907a);
    }
    .book-highlight .bh-info { flex: 1; min-width: 0; }
    .book-highlight .bh-title {
      font-family: var(--f-display);
      font-size: 0.9rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      margin-bottom: 0.15rem;
    }
    .book-highlight .bh-author {
      font-size: 0.75rem;
      color: var(--ink-3);
      font-style: italic;
      display: block;
    }
    .book-highlight .bh-rating {
      font-family: var(--f-display);
      font-size: 1rem;
      color: #BB858B;
      flex-shrink: 0;
    }

    .highlight-tag {
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      display: block;
      margin-bottom: 0.625rem;
    }

    .loading {
      text-align: center;
      padding: 3rem 1.25rem;
      color: var(--ink-3);
      font-style: italic;
      font-size: 0.9rem;
    }

    @media (min-width: 640px) {
      .stats-header { padding: 3rem 2rem 2rem; }
      .stats-nav { padding: 1rem 2rem; }
      .stats-wrap { padding: 1.5rem 2rem; gap: 1.25rem; }
      .metric-row { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

  <nav class="stats-nav">
    <a href="books.html">← All books</a>
    <span class="nav-center">Club stats</span>
    <span></span>
  </nav>

  <header class="stats-header">
    <span class="page-eyebrow">by the numbers</span>
    <h1 class="page-title">Club <em>Stats</em></h1>
    <div class="page-title-rule"><span>all time</span></div>
  </header>

  <div id="stats-wrap" class="stats-wrap">
    <p class="loading">Loading stats…</p>
  </div>

  <script>
    function normalize(str) { return str?.toLowerCase().trim() || ""; }

    function starsHTML(rating) {
      if (!rating) return "";
      const full = Math.floor(rating);
      const half = rating % 1 >= 0.5;
      const empty = 5 - full - (half ? 1 : 0);
      let html = `<span class="stars" style="font-size:0.85rem">`;
      html += "★".repeat(full);
      if (half) html += `<span style="font-size:0.6em;vertical-align:middle;">½</span>`;
      html += `<span style="opacity:0.25">${"★".repeat(empty)}</span>`;
      html += "</span>";
      return html;
    }

    const MEMBERS = ["Courtney", "Emily", "Alyssa", "Sam"];
    const AVATAR_CLASSES = ["", "av-2", "av-3", "av-4"];

    async function loadStats() {
      const wrap = document.getElementById("stats-wrap");

      try {
        const [booksRes, entriesRes] = await Promise.all([
          fetch('/api/books'),
          fetch('/api/entries')
        ]);
        const booksData = await booksRes.json();
        const entriesData = await entriesRes.json();

        const books = booksData.records.map(r => r.fields);
        const entries = entriesData.records.map(r => r.fields);

        // ── Attach entries to books ──
        const booksWithEntries = books.map(book => {
          const bookEntries = entries.filter(e =>
            e?.BookSlug && (
              normalize(e.BookSlug) === normalize(book?.Slug || "") ||
              normalize(e.BookSlug) === normalize(book?.Title || "")
            )
          );
          const ratings = bookEntries.map(e => Number(e.Rating)).filter(r => !isNaN(r) && r > 0);
          const avg = ratings.length > 0
            ? Math.round((ratings.reduce((a, b) => a + b, 0) / ratings.length) * 10) / 10
            : null;
          return { ...book, entries: bookEntries, avgRating: avg, ratings };
        });

        const ratedBooks = booksWithEntries.filter(b => b.avgRating !== null);
        const totalReviews = entries.filter(e => Number(e.Rating) > 0).length;

        // ── Overall avg ──
        const allRatings = entries.map(e => Number(e.Rating)).filter(r => !isNaN(r) && r > 0);
        const overallAvg = allRatings.length > 0
          ? Math.round((allRatings.reduce((a, b) => a + b, 0) / allRatings.length) * 10) / 10
          : null;

        // ── Highest rated ──
        const highest = [...ratedBooks].sort((a, b) => b.avgRating - a.avgRating)[0];
        const lowest = [...ratedBooks].sort((a, b) => a.avgRating - b.avgRating)[0];

        // ── Most divisive (biggest std deviation) ──
        const divisive = [...ratedBooks]
          .filter(b => b.ratings.length >= 2)
          .map(b => {
            const mean = b.avgRating;
            const variance = b.ratings.reduce((sum, r) => sum + Math.pow(r - mean, 2), 0) / b.ratings.length;
            return { ...b, spread: Math.round(Math.sqrt(variance) * 10) / 10 };
          })
          .sort((a, b) => b.spread - a.spread)[0];

        // ── Goodreads vs Club comparison ──
        const grComparison = ratedBooks
          .filter(b => b["GoodreadsRating"] && !isNaN(Number(b["GoodreadsRating"])))
          .map(b => ({
            title: b.Title,
            author: b.Author,
            cover: b.BookCover,
            gr: Number(b["GoodreadsRating"]),
            club: b.avgRating,
            diff: Math.round((b.avgRating - Number(b["GoodreadsRating"])) * 10) / 10
          }))
          .sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));

        const grAvg = grComparison.length > 0
          ? Math.round((grComparison.reduce((s, b) => s + b.gr, 0) / grComparison.length) * 10) / 10
          : null;

        // ── Render ──
        wrap.innerHTML = `
          <!-- Metric cards -->
          <div class="metric-row">
            <div class="metric-card">
              <span class="metric-label">Books read</span>
              <span class="metric-value">${books.length}</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Reviews</span>
              <span class="metric-value">${totalReviews}</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Club avg</span>
              <span class="metric-value">${overallAvg || "—"}</span>
              <span class="metric-sub">out of 5</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Goodreads avg</span>
              <span class="metric-value">${grAvg || "—"}</span>
              <span class="metric-sub">out of 5</span>
            </div>
          </div>

          <!-- Goodreads vs Club -->
          <div class="stat-panel">
            <div class="stat-panel-title">
              Us vs Goodreads
              <span style="font-family:var(--f-body);font-size:0.7rem;color:var(--ink-3);font-weight:400;">biggest differences</span>
            </div>
            ${grComparison.slice(0, 6).map(b => `
              <div class="bar-row" style="align-items:flex-start;padding:0.75rem 0;gap:0.875rem;">
                ${b.cover
                  ? `<img src="${b.cover}" style="width:36px;min-width:36px;height:52px;border-radius:4px;object-fit:cover;border:0.5px solid var(--line);" />`
                  : `<div style="width:36px;min-width:36px;height:52px;border-radius:4px;background:linear-gradient(155deg,#D8A48F,#c4907a);border:0.5px solid var(--line);"></div>`}
                <div style="flex:1;min-width:0;">
                  <div style="font-family:var(--f-display);font-size:0.875rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0.3rem;">${b.title}</div>
                  <div style="display:flex;gap:1rem;align-items:center;">
                    <span style="font-size:0.75rem;color:var(--ink-3);">Club <strong style="color:var(--ink);font-family:var(--f-display);">${b.club}</strong></span>
                    <span style="font-size:0.75rem;color:var(--ink-3);">GR <strong style="color:var(--ink);font-family:var(--f-display);">${b.gr}</strong></span>
                    <span style="font-size:0.75rem;font-style:italic;color:${b.diff > 0 ? '#6b2737' : '#8a8a6a'};">
                      ${b.diff > 0 ? '▲' : '▼'} ${Math.abs(b.diff)} ${b.diff > 0 ? 'above' : 'below'} GR
                    </span>
                  </div>
                </div>
              </div>
            `).join("")}
          </div>

          <!-- Rating bars -->
          <div class="stat-panel">
            <div class="stat-panel-title">Club vs Goodreads avg</div>
            <div class="bar-row">
              <span class="bar-label">Club avg</span>
              <div class="bar-track">
                <div class="bar-fill" style="width:${((overallAvg || 0) / 5) * 100}%;background:#BB858B;"></div>
              </div>
              <span class="bar-val">${overallAvg || "—"}</span>
            </div>
            <div class="bar-row">
              <span class="bar-label">Goodreads</span>
              <div class="bar-track">
                <div class="bar-fill" style="width:${((grAvg || 0) / 5) * 100}%;background:#6b2737;"></div>
              </div>
              <span class="bar-val">${grAvg || "—"}</span>
            </div>
          </div>

          <!-- Highlights -->
          <div class="stat-panel">
            <div class="stat-panel-title">Book highlights</div>

            ${highest ? `
              <span class="highlight-tag">Highest rated by club</span>
              <div class="book-highlight">
                ${highest.BookCover ? `<img src="${highest.BookCover}" alt="${highest.Title}" />` : `<div class="bh-ph"></div>`}
                <div class="bh-info">
                  <span class="bh-title">${highest.Title}</span>
                  <span class="bh-author">${highest.Author}</span>
                  ${starsHTML(highest.avgRating)}
                </div>
                <span class="bh-rating">${highest.avgRating}</span>
              </div>
            ` : ""}

            ${lowest && lowest.Title !== highest?.Title ? `
              <span class="highlight-tag" style="margin-top:0.875rem;display:block">Lowest rated by club</span>
              <div class="book-highlight">
                ${lowest.BookCover ? `<img src="${lowest.BookCover}" alt="${lowest.Title}" />` : `<div class="bh-ph"></div>`}
                <div class="bh-info">
                  <span class="bh-title">${lowest.Title}</span>
                  <span class="bh-author">${lowest.Author}</span>
                  ${starsHTML(lowest.avgRating)}
                </div>
                <span class="bh-rating">${lowest.avgRating}</span>
              </div>
            ` : ""}

            ${divisive ? `
              <span class="highlight-tag" style="margin-top:0.875rem;display:block">Most divisive</span>
              <div class="book-highlight">
                ${divisive.BookCover ? `<img src="${divisive.BookCover}" alt="${divisive.Title}" />` : `<div class="bh-ph"></div>`}
                <div class="bh-info">
                  <span class="bh-title">${divisive.Title}</span>
                  <span class="bh-author">${divisive.Author}</span>
                  <span style="font-size:0.75rem;color:var(--ink-3);font-style:italic;">±${divisive.spread} spread</span>
                </div>
                <span class="bh-rating">${divisive.avgRating}</span>
              </div>
            ` : ""}
          </div>

          <!-- Biggest Goodreads Contrarian -->
          ${grComparison.length > 0 ? (() => {
            const loveIt = grComparison.filter(b => b.diff > 0).sort((a,b) => b.diff - a.diff)[0];
            const hateIt = grComparison.filter(b => b.diff < 0).sort((a,b) => a.diff - b.diff)[0];
            return `
            <div class="stat-panel">
              <div class="stat-panel-title">Biggest Goodreads contrarians</div>
              <p style="font-size:0.8rem;color:var(--ink-3);font-style:italic;margin-bottom:1rem;">Books where we disagreed most with the internet</p>

              ${loveIt ? `
                <span class="highlight-tag">We loved it, GR didn't</span>
                <div class="book-highlight" style="margin-bottom:0.5rem;">
                  ${loveIt.cover ? `<img src="${loveIt.cover}" style="width:40px;min-width:40px;height:58px;border-radius:4px;object-fit:cover;border:0.5px solid var(--line);" />` : `<div class="bh-ph"></div>`}
                  <div class="bh-info">
                    <span class="bh-title">${loveIt.title}</span>
                    <span class="bh-author" style="margin-bottom:0.3rem;display:block;">${loveIt.author}</span>
                    <span style="font-size:0.75rem;color:var(--ink-3);">Club <strong style="color:#6b2737;font-family:var(--f-display);">${loveIt.club}</strong> vs GR <strong style="color:var(--ink-2);font-family:var(--f-display);">${loveIt.gr}</strong></span>
                  </div>
                  <span style="font-family:var(--f-display);font-size:1rem;color:#6b2737;flex-shrink:0;">+${loveIt.diff}</span>
                </div>
              ` : ""}

              ${hateIt ? `
                <span class="highlight-tag" style="margin-top:0.875rem;display:block;">GR loved it, we didn't</span>
                <div class="book-highlight">
                  ${hateIt.cover ? `<img src="${hateIt.cover}" style="width:40px;min-width:40px;height:58px;border-radius:4px;object-fit:cover;border:0.5px solid var(--line);" />` : `<div class="bh-ph"></div>`}
                  <div class="bh-info">
                    <span class="bh-title">${hateIt.title}</span>
                    <span class="bh-author" style="margin-bottom:0.3rem;display:block;">${hateIt.author}</span>
                    <span style="font-size:0.75rem;color:var(--ink-3);">Club <strong style="color:var(--ink-2);font-family:var(--f-display);">${hateIt.club}</strong> vs GR <strong style="color:#6b2737;font-family:var(--f-display);">${hateIt.gr}</strong></span>
                  </div>
                  <span style="font-family:var(--f-display);font-size:1rem;color:#8a8a6a;flex-shrink:0;">${hateIt.diff}</span>
                </div>
              ` : ""}
            </div>`;
          })() : ""}

          <!-- Year Snapshots -->
          ${(() => {
            const yearBooks = booksWithEntries.filter(b => b["Date Read"]);
            if (yearBooks.length === 0) return "";

            const years = [...new Set(yearBooks.map(b => new Date(b["Date Read"]).getFullYear()))].sort((a,b) => b - a);

            return `
            <div class="stat-panel">
              <div class="stat-panel-title">Year by year</div>
              <div style="display:flex;flex-direction:column;gap:1rem;margin-top:0.25rem;">
                ${years.map(year => {
                  const yBooks = yearBooks.filter(b => new Date(b["Date Read"]).getFullYear() === year);
                  const yRated = yBooks.filter(b => b.avgRating !== null);
                  const yAvg = yRated.length > 0
                    ? Math.round((yRated.reduce((s,b) => s + b.avgRating, 0) / yRated.length) * 10) / 10
                    : null;
                  const yGrAvg = (() => {
                    const grBooks = yBooks.filter(b => b["GoodreadsRating"] && !isNaN(Number(b["GoodreadsRating"])));
                    return grBooks.length > 0
                      ? Math.round((grBooks.reduce((s,b) => s + Number(b["GoodreadsRating"]), 0) / grBooks.length) * 10) / 10
                      : null;
                  })();
                  const yHighest = yRated.length > 0 ? yRated.sort((a,b) => b.avgRating - a.avgRating)[0] : null;
                  const yReviews = entries.filter(e => {
                    const book = yBooks.find(b =>
                      normalize(b.Slug || "") === normalize(e.BookSlug || "") ||
                      normalize(b.Title || "") === normalize(e.BookSlug || "")
                    );
                    return book && Number(e.Rating) > 0;
                  }).length;

                  return `
                  <div style="background:var(--bg-card-h);border:0.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;">
                    <div style="background:#BB858B;padding:0.75rem 1rem;display:flex;justify-content:space-between;align-items:center;">
                      <span style="font-family:var(--f-display);font-size:1.3rem;color:#EFEBCE;">${year}</span>
                      <span style="font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(239,235,206,0.75);">${yBooks.length} book${yBooks.length !== 1 ? "s" : ""}</span>
                    </div>
                    <div style="padding:1rem;">
                      <div style="display:flex;gap:1.25rem;margin-bottom:${yHighest ? "1rem" : "0"};">
                        <div>
                          <div style="font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0.2rem;">Club avg</div>
                          <div style="font-family:var(--f-display);font-size:1.6rem;color:var(--ink);line-height:1;">${yAvg || "—"}</div>
                        </div>
                        ${yGrAvg ? `
                        <div>
                          <div style="font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0.2rem;">GR avg</div>
                          <div style="font-family:var(--f-display);font-size:1.6rem;color:var(--ink);line-height:1;">${yGrAvg}</div>
                        </div>` : ""}
                        <div>
                          <div style="font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0.2rem;">Reviews</div>
                          <div style="font-family:var(--f-display);font-size:1.6rem;color:var(--ink);line-height:1;">${yReviews}</div>
                        </div>
                      </div>

                      ${yHighest ? `
                      <div style="border-top:0.5px solid var(--line);padding-top:0.875rem;">
                        <div style="font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0.625rem;">Favourite read</div>
                        <div style="display:flex;gap:0.75rem;align-items:center;">
                          ${yHighest.BookCover
                            ? `<img src="${yHighest.BookCover}" style="width:48px;min-width:48px;height:70px;border-radius:var(--r-sm);object-fit:cover;border:0.5px solid var(--line);box-shadow:0 4px 12px rgba(30,30,16,0.14);" />`
                            : `<div style="width:48px;min-width:48px;height:70px;border-radius:var(--r-sm);background:linear-gradient(155deg,#D8A48F,#c4907a);border:0.5px solid var(--line);"></div>`}
                          <div style="flex:1;min-width:0;">
                            <div style="font-family:var(--f-display);font-size:0.95rem;color:var(--ink);line-height:1.2;margin-bottom:0.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${yHighest.Title}</div>
                            <div style="font-size:0.8rem;font-style:italic;color:var(--ink-3);margin-bottom:0.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${yHighest.Author}</div>
                            ${starsHTML(yHighest.avgRating)}
                          </div>
                          <div style="font-family:var(--f-display);font-size:1.25rem;color:#BB858B;flex-shrink:0;">${yHighest.avgRating}</div>
                        </div>
                      </div>` : ""}
                    </div>
                  </div>`;
                }).join("")}
              </div>
            </div>`;
          })()}
        `;

      } catch (err) {
        console.error(err);
        wrap.innerHTML = `<p class="loading">Couldn't load stats. Try refreshing.</p>`;
      }
    }

    document.addEventListener("DOMContentLoaded", loadStats);
  </script>
</body>
</html>
