<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="book-nav" class="book-nav"></nav>

  <div id="book-container"></div>

  <section class="entries-section">
    <h2 class="section-heading">
      Book Club Thoughts
      <span class="count" id="entry-count"></span>
    </h2>
    <div id="entries-container"></div>
  </section>

  <section class="form-section">
    <h2 class="section-heading">Share a thought or resource</h2>
    <p class="section-sub">Before, during, or after reading — drop a note, a link, or a rating whenever.</p>

    <form id="entry-form">
      <select id="name" required>
        <option value="">Your name…</option>
        <option value="Courtney">Courtney</option>
        <option value="Emily">Emily</option>
        <option value="Alyssa">Alyssa</option>
        <option value="Sam">Sam</option>
        <option value="__guest__">Guest</option>
      </select>

      <input type="text" id="guest-name" placeholder="Your name…" style="display:none" />

      <div class="star-rating-input">
        <span class="star-label">Rating <span class="optional-label">(optional)</span></span>
        <div class="star-picker" id="star-picker">
          <span class="star-pick" data-value="1">★</span>
          <span class="star-pick" data-value="2">★</span>
          <span class="star-pick" data-value="3">★</span>
          <span class="star-pick" data-value="4">★</span>
          <span class="star-pick" data-value="5">★</span>
        </div>
        <span class="star-value-label" id="star-value-label"></span>
        <input type="hidden" id="rating" />
      </div>

      <textarea id="note" placeholder="Notes, reactions, a quote, first impressions…"></textarea>

      <input type="text" id="link" placeholder="Link to an article, review, or resource…" />

      <button type="submit">Submit</button>
    </form>
  </section>

  <script src="book.js"></script>
</body>
</html>
